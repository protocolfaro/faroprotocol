<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faro Protocol - Prescripcion de Campo - Velez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root {
    --bg:#06080d;--bg2:#0b0f17;--gold:#c9a84c;--gold2:#e8c97a;
    --whi:#eceae3;--dim:#7a7670;--dim2:#4a4845;
    --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--cyan:#22d3ee;
    --green:#22c55e;--purple:#a855f7;--gray:#6b7280;
    --c-HOY:#ef4444;--c-ESTA_SEMANA:#f59e0b;--c-PROXIMA_SEMANA:#3b82f6;
    --c-MONITOREAR:#6b7280;--c-OK:#22c55e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--whi);font-family:'Epilogue',sans-serif;width:100vw;height:100vh;display:flex;flex-direction:row;overflow:hidden;}
.nav-tabs{position:absolute;top:14px;left:20px;z-index:200;display:flex;align-items:center;gap:5px;overflow-x:auto;max-width:calc(56% - 40px);white-space:nowrap;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;background:rgba(20,26,38,0.8);border:1px solid rgba(255,255,255,0.07);color:var(--dim);padding:4px 9px;border-radius:10px;font-size:9px;font-weight:700;cursor:pointer;font-family:'Epilogue',sans-serif;transition:all 0.2s;letter-spacing:0.4px;}
.tab-btn.active{background:var(--gold);color:#050709;border-color:var(--gold);}
.tab-btn:hover:not(.active){border-color:rgba(255,255,255,0.2);color:var(--whi);}
.tab-sep{flex-shrink:0;width:1px;height:18px;background:rgba(255,255,255,0.1);}
.wrapper-field{width:56%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:58px 20px 18px 42px;}
.text-stadium{position:absolute;left:12px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center center;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.15);white-space:nowrap;pointer-events:none;}
.field-container{position:relative;height:100%;width:auto;aspect-ratio:68/105;max-width:100%;background:#0e1e10;border-radius:7px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03);}
.presc-overlay{position:absolute;inset:0;z-index:1;pointer-events:all;}
.presc-overlay svg{width:100%;height:100%;display:block;}
.heatmap-canvas{position:absolute;inset:0;z-index:0;transition:opacity 0.4s;pointer-events:none;}
.field-svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}
.sat-badge{position:absolute;bottom:8px;left:8px;z-index:20;font-size:8px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;color:#fff;display:flex;align-items:center;gap:4px;pointer-events:none;}
.sat-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.hm-toggle{position:absolute;top:8px;right:8px;z-index:20;font-size:8px;font-weight:700;letter-spacing:0.6px;padding:3px 9px;border-radius:4px;background:rgba(20,26,38,0.85);border:1px solid rgba(255,255,255,0.1);color:var(--dim);cursor:pointer;transition:all 0.2s;}
.hm-toggle.on{background:rgba(34,197,94,0.15);border-color:var(--green);color:var(--green);}
.panel{width:44%;height:100%;background:var(--bg2);border-left:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;overflow:hidden;}
.panel-head{flex-shrink:0;padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:flex-start;}
.panel-brand{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:0.5px;}
.panel-sync{font-size:8px;color:var(--dim);text-align:right;line-height:1.5;}
.panel-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;}
.panel-body::-webkit-scrollbar{width:2px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px;}
.cancha-head{flex-shrink:0;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center;}
.cancha-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold);}
.urgency-badge{font-size:9px;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:0.8px;color:#fff;}
.zone-grid{flex-shrink:0;padding:10px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;border-bottom:1px solid rgba(255,255,255,0.04);}
.zone-tile{border-radius:4px;padding:6px 8px;cursor:pointer;transition:all 0.18s;border:1px solid rgba(255,255,255,0.06);}
.zone-tile.selected{outline:1px solid rgba(255,255,255,0.45);}
.zone-tile:hover{filter:brightness(1.15);}
.zone-tile-label{font-size:7px;font-weight:700;letter-spacing:0.6px;color:rgba(255,255,255,0.65);}
.zone-tile-urgency{font-size:8px;font-weight:700;color:#fff;margin-top:2px;}
.zone-tile-type{font-size:7px;color:rgba(255,255,255,0.55);margin-top:1px;}
.zone-detail{flex-shrink:0;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);}
.zone-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.zone-detail-name{font-size:11px;font-weight:700;color:var(--whi);letter-spacing:0.3px;}
.zone-detail-urgency{font-size:8px;font-weight:700;letter-spacing:0.8px;padding:3px 8px;border-radius:3px;color:#fff;}
.action-list{display:flex;flex-direction:column;gap:6px;}
.action-item{border-radius:4px;padding:8px 10px;border-left:2px solid;}
.action-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.action-type{font-size:8px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;}
.action-urgency{font-size:8px;font-weight:700;letter-spacing:0.5px;flex-shrink:0;}
.action-detail{font-size:9px;color:var(--dim);margin-top:4px;line-height:1.4;}
.action-metric{font-size:7px;color:var(--dim2);margin-top:2px;font-weight:600;letter-spacing:0.3px;}
.metrics-section{flex-shrink:0;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);}
.metrics-title{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.metric-cell{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;}
.metric-label{font-size:7px;font-weight:700;letter-spacing:0.5px;color:var(--dim);text-transform:uppercase;}
.metric-value{font-size:12px;font-weight:700;color:var(--whi);margin-top:2px;}
.metric-unit{font-size:7px;color:var(--dim);}
.fungal-section{flex-shrink:0;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);}
.fungal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.fungal-label{font-size:8px;font-weight:700;letter-spacing:0.8px;color:var(--dim);text-transform:uppercase;}
.fungal-badge{font-size:8px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:0.5px;color:#fff;}
.fungal-bar-bg{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.fungal-bar-fill{height:100%;border-radius:2px;transition:width 0.8s ease;}
.fungal-desc{font-size:8px;color:var(--dim);margin-top:5px;line-height:1.4;}
.era5-section{flex-shrink:0;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);}
.era5-title{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
.era5-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.era5-cell{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;}
.era5-label{font-size:6px;font-weight:700;letter-spacing:0.5px;color:var(--dim);text-transform:uppercase;}
.era5-value{font-size:11px;font-weight:700;color:var(--whi);margin-top:2px;}
.era5-unit{font-size:6px;color:var(--dim);}
.action-razon{font-size:8px;color:var(--cyan);margin-top:3px;line-height:1.3;}
.gdd-section{flex-shrink:0;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;gap:10px;align-items:center;}
.gdd-item{flex:1;}
.gdd-label{font-size:7px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;}
.gdd-value{font-size:14px;font-weight:700;color:var(--whi);margin-top:2px;}
.gdd-unit{font-size:7px;color:var(--dim);}
.gdd-sep{width:1px;height:30px;background:rgba(255,255,255,0.06);}
.ipos-section{flex-shrink:0;padding:10px 16px;}
.ipos-header{display:flex;justify-content:space-between;margin-bottom:5px;}
.ipos-label{font-size:8px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;}
.ipos-value{font-size:8px;font-weight:700;color:var(--whi);}
.ipos-bar-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.ipos-bar-fill{height:100%;border-radius:3px;transition:width 0.8s ease;}
.ipos-tiers{display:flex;justify-content:space-between;margin-top:3px;font-size:6px;color:var(--dim2);}
.sar-section{flex-shrink:0;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.04);}
.sar-title{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.sar-date{font-size:7px;color:var(--dim2);font-weight:600;}
.sar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.sar-cell{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:4px;padding:6px 8px;}
.sar-cell.alert{border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.05);}
.sar-cell.warn{border-color:rgba(245,158,11,0.4);}
.sar-cell-label{font-size:7px;font-weight:700;letter-spacing:0.5px;color:var(--dim);text-transform:uppercase;}
.sar-cell-val{font-size:13px;font-weight:700;color:var(--whi);margin-top:2px;}
.sar-cell-unit{font-size:7px;color:var(--dim);}
.sar-cell-status{font-size:7px;font-weight:700;margin-top:2px;letter-spacing:0.4px;}
.sar-chart-wrap{flex-shrink:0;height:140px;border-top:1px solid rgba(255,255,255,0.04);padding:8px 16px 6px;}
.sar-chart-title{font-size:8px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.grid3x3-section{flex-shrink:0;border-top:1px solid rgba(255,255,255,0.04);}
.grid3x3-header{padding:8px 16px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.grid3x3-label{font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
.grid3x3-toggle{font-size:8px;color:var(--dim2);font-weight:700;}
.grid3x3-body{padding:6px 16px 10px;display:none;}
.grid3x3-body.open{display:block;}
.grid3x3-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.g3-cell{border-radius:4px;padding:6px 7px;border:1px solid rgba(255,255,255,0.06);}
.g3-cell.CRÍTICA{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.07);}
.g3-cell.ALTA{border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.05);}
.g3-cell.ESTABLE{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.04);}
.g3-id{font-size:7px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:3px;}
.g3-vv{font-size:10px;font-weight:700;color:var(--whi);}
.g3-hum{font-size:8px;color:var(--dim);margin-top:1px;}
.g3-accion{font-size:7px;color:var(--amber);margin-top:3px;line-height:1.3;}
.g3-cell.ESTABLE .g3-accion{color:var(--green);}
@media(max-width:768px){
    body{flex-direction:column;overflow-y:auto;height:auto;}
    .wrapper-field{width:100%;height:55vh;padding:50px 12px 12px 12px;}
    .panel{width:100%;height:auto;border-left:none;border-top:1px solid rgba(255,255,255,0.05);overflow:visible;}
    .nav-tabs{max-width:calc(100% - 40px);}
    .text-stadium{display:none;}
    .sar-chart-wrap{height:120px;}
}
</style>
</head>
<body>
<nav class="nav-tabs" id="tabsCanchas"></nav>
<div class="wrapper-field">
    <div class="text-stadium">Estadio Jose Amalfitani - Velez Sarsfield</div>
    <div class="field-container" id="fieldContainer">
        <canvas class="heatmap-canvas" id="heatmapCanvas" style="width:100%;height:100%;opacity:0;"></canvas>
        <div class="presc-overlay" id="prescOverlay">
            <svg id="prescSvg" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg" style="pointer-events:all;"></svg>
        </div>
        <svg class="field-svg" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg">
            <defs><pattern id="lawn" width="8" height="105" patternUnits="userSpaceOnUse">
                <rect width="4" height="105" fill="rgba(255,255,255,0.025)"/>
                <rect x="4" width="4" height="105" fill="rgba(0,0,0,0.01)"/>
            </pattern></defs>
            <rect width="68" height="105" fill="url(#lawn)"/>
            <rect x="3" y="3" width="62" height="99" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <line x1="3" y1="52.5" x2="65" y2="52.5" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <circle cx="34" cy="52.5" r="9.15" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <circle cx="34" cy="52.5" r="0.5" fill="rgba(255,255,255,0.4)"/>
            <rect x="13.8" y="3" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <rect x="13.8" y="85.5" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <rect x="22" y="3" width="24" height="5.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <rect x="22" y="96.5" width="24" height="5.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <circle cx="34" cy="14" r="0.5" fill="rgba(255,255,255,0.4)"/>
            <circle cx="34" cy="91" r="0.5" fill="rgba(255,255,255,0.4)"/>
            <path d="M 22 19.5 A 9.15 9.15 0 0 1 46 19.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <path d="M 22 85.5 A 9.15 9.15 0 0 0 46 85.5" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="0.5"/>
            <path d="M 3 5.5 A 2.5 2.5 0 0 0 5.5 3" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.4"/>
            <path d="M 62.5 3 A 2.5 2.5 0 0 0 65 5.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.4"/>
            <path d="M 3 99.5 A 2.5 2.5 0 0 1 5.5 102" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.4"/>
            <path d="M 65 99.5 A 2.5 2.5 0 0 0 62.5 102" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.4"/>
        </svg>
        <button class="hm-toggle" id="hmToggle" onclick="toggleHeatmap()">NDVI OFF</button>
        <div class="sat-badge" id="satBadge"><span class="sat-dot" id="satDot"></span><span id="satText">-</span></div>
    </div>
</div>
<div class="panel">
    <div class="panel-head">
        <div class="panel-brand">FARO PROTOCOL - PRESCRIPCION DE CAMPO</div>
        <div class="panel-sync" id="panelSync">-<br><span style="font-size:7px;opacity:0.6">cargando...</span></div>
    </div>
    <div class="panel-body" id="panelBody">
        <div style="padding:30px 16px;color:var(--dim);font-size:10px;">Cargando datos de campo...</div>
    </div>
    <div class="sar-chart-wrap" id="sarChartWrap" style="display:none;">
        <div class="sar-chart-title">SAR VV — COMPACTACIÓN HISTÓRICA (30 días)</div>
        <canvas id="sarTrendChart"></canvas>
    </div>
    <div class="grid3x3-section" id="grid3x3Section" style="display:none;">
        <div class="grid3x3-header" onclick="toggleGrid3x3()">
            <span class="grid3x3-label">ANÁLISIS 3×3 — SECTORES AMALFITANI</span>
            <span class="grid3x3-toggle" id="grid3x3Toggle">▼ VER</span>
        </div>
        <div class="grid3x3-body" id="grid3x3Body"></div>
    </div>
</div>
<script>
'use strict';
const ENDPOINT='https://faroprotocol-production-45fd.up.railway.app/velez/prescriptions';
const POLL_MS=5*60*1000;
let _data=null,_activeCanchaId=null,_activeZoneId='GK_N',_hmVisible=false;
const UL={HOY:'HOY',ESTA_SEMANA:'ESTA SEMANA',PROXIMA_SEMANA:'PROX. SEMANA',MONITOREAR:'MONITOREAR',OK:'OK'};
const ACTION_COL={AEREAR:'#f59e0b',REGAR:'#22d3ee',FUNGICIDA:'#a855f7',FERTILIZAR:'#22c55e',DRENAR:'#3b82f6',OK:'#22c55e'};
const URG_BG={HOY:'rgba(239,68,68,0.14)',ESTA_SEMANA:'rgba(245,158,11,0.10)',PROXIMA_SEMANA:'rgba(59,130,246,0.10)',MONITOREAR:'rgba(107,114,128,0.07)',OK:'rgba(34,197,94,0.06)'};
const ZONE_SHORT={GK_N:'GK N',AREA_N:'AREA N',MID_N:'MEDIO N',MID_S:'MEDIO S',AREA_S:'AREA S',GK_S:'GK S'};
const ZONE_FULL={GK_N:'Porteria Norte',AREA_N:'Area Penal Norte',MID_N:'Mediocampo Norte',MID_S:'Mediocampo Sur',AREA_S:'Area Penal Sur',GK_S:'Porteria Sur'};
const ZONE_COORDS={GK_N:{x:3,y:3,w:62,h:16.5},AREA_N:{x:3,y:19.5,w:62,h:13.5},MID_N:{x:3,y:33,w:62,h:19.5},MID_S:{x:3,y:52.5,w:62,h:19.5},AREA_S:{x:3,y:72,w:62,h:13.5},GK_S:{x:3,y:85.5,w:62,h:16.5}};
function hex(u){return({HOY:'#ef4444',ESTA_SEMANA:'#f59e0b',PROXIMA_SEMANA:'#3b82f6',MONITOREAR:'#6b7280',OK:'#22c55e'})[u]||'#22c55e';}
function fmt1(v){return v!=null?parseFloat(v).toFixed(1):'-';}
function fmt0(v){return v!=null?Math.round(parseFloat(v)):'-';}
function canName(id){return id==='amalfitani'?'AMALFITANI':(id||'').toUpperCase().replace(/_/g,' ');}
function hexRgb(h){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?`${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}`:'255,255,255';}
function updateSatBadge(cancha){
    const badge=document.getElementById('satBadge'),dot=document.getElementById('satDot'),txt=document.getElementById('satText');
    if(!badge)return;
    const hm=cancha?.heatmap_arquivo||cancha?.heatmap_archivo||'';
    if(!hm){badge.style.background='rgba(80,60,0,0.85)';dot.style.background='#d4a017';txt.textContent='NDVI ESTIMADO - Kalman';}
    else{badge.style.background='rgba(0,40,20,0.85)';dot.style.background='#4caf50';txt.textContent='NDVI SAT - '+hm.replace('heatmap_','').replace('.png','').toUpperCase();}
}
let _hmFile=null;
async function renderHeatmap(file){
    const canvas=document.getElementById('heatmapCanvas');
    if(!canvas||!canvas.getContext)return;
    if(!file){canvas.style.opacity='0';return;}
    _hmFile=file;
    const dpr=window.devicePixelRatio||1,cssW=canvas.offsetWidth||400,cssH=canvas.offsetHeight||600;
    canvas.width=cssW*dpr;canvas.height=cssH*dpr;canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,cssW,cssH);
    const url=`https://raw.githubusercontent.com/protocolfaro/faroprotocol/main/velez/heatmaps/${file}`;
    return new Promise(res=>{
        const img=new Image();img.crossOrigin='anonymous';
        img.onload=()=>{ctx.save();ctx.translate(cssW,0);ctx.rotate(Math.PI/2);ctx.drawImage(img,0,0,736,484,0,0,cssH,cssW);ctx.restore();canvas.style.opacity=_hmVisible?'0.55':'0';res();};
        img.onerror=()=>{canvas.style.opacity='0';res();};img.src=url;
    });
}

function renderZones(cancha){
    const svg=document.getElementById('prescSvg');if(!svg||!cancha?.zones)return;
    svg.innerHTML='';const NS='http://www.w3.org/2000/svg';
    Object.entries(cancha.zones).forEach(([zid,zone])=>{
        const rc=ZONE_COORDS[zid]||{},u=zone.urgency||'OK',color=hex(u);
        const isHoy=u==='HOY',isOK=u==='OK',opBase=isOK?0.09:isHoy?0.42:0.28,isActive=_activeZoneId===zid;
        const g=document.createElementNS(NS,'g');g.style.cursor='pointer';
        const rect=document.createElementNS(NS,'rect');
        rect.setAttribute('x',rc.x);rect.setAttribute('y',rc.y);rect.setAttribute('width',rc.w);rect.setAttribute('height',rc.h);
        rect.setAttribute('fill',color);rect.setAttribute('fill-opacity',isActive?Math.min(0.9,opBase*1.6):opBase);
        if(isHoy){const anim=document.createElementNS(NS,'animate');anim.setAttribute('attributeName','fill-opacity');anim.setAttribute('values',`${opBase};${opBase*1.9};${opBase}`);anim.setAttribute('dur','1.6s');anim.setAttribute('repeatCount','indefinite');rect.appendChild(anim);}
        g.appendChild(rect);
        if(isActive){const br=document.createElementNS(NS,'rect');br.setAttribute('x',rc.x+0.3);br.setAttribute('y',rc.y+0.3);br.setAttribute('width',rc.w-0.6);br.setAttribute('height',rc.h-0.6);br.setAttribute('fill','none');br.setAttribute('stroke','rgba(255,255,255,0.85)');br.setAttribute('stroke-width','0.4');g.appendChild(br);}
        if(!isOK){
            const cx=rc.x+rc.w/2,cy=rc.y+rc.h/2;
            const lbl=document.createElementNS(NS,'text');lbl.setAttribute('x',cx);lbl.setAttribute('y',cy-1.6);lbl.setAttribute('text-anchor','middle');lbl.setAttribute('font-family','Epilogue,sans-serif');lbl.setAttribute('font-size','3.0');lbl.setAttribute('font-weight','700');lbl.setAttribute('fill','#fff');lbl.setAttribute('fill-opacity','0.85');lbl.textContent=ZONE_SHORT[zid]||zid;g.appendChild(lbl);
            const pt=zone.primary||{};
            if(pt.type&&pt.type!=='OK'){const sub=document.createElementNS(NS,'text');sub.setAttribute('x',cx);sub.setAttribute('y',cy+2.4);sub.setAttribute('text-anchor','middle');sub.setAttribute('font-family','Epilogue,sans-serif');sub.setAttribute('font-size','2.4');sub.setAttribute('font-weight','700');sub.setAttribute('fill','#fff');sub.setAttribute('fill-opacity','0.65');sub.textContent=pt.type;g.appendChild(sub);}
        }
        g.addEventListener('click',()=>selectZone(zid));svg.appendChild(g);
    });
}

    const era5Html=`<div class="era5-section"><div class="era5-title">ERA5-LAND — HUMEDAD POR CAPA (referencia)</div><div class="era5-grid"><div class="era5-cell"><div class="era5-label">0–7 cm</div><div class="era5-value">${era5_0_7!=null?Math.round(era5_0_7*100):'—'}<span class="era5-unit"> %</span></div></div><div class="era5-cell"><div class="era5-label">7–28 cm</div><div class="era5-value">${era5_7_28!=null?Math.round(era5_7_28*100):'—'}<span class="era5-unit"> %</span></div></div><div class="era5-cell"><div class="era5-label">28–100 cm</div><div class="era5-value">${era5_28_100!=null?Math.round(era5_28_100*100):'—'}<span class="era5-unit"> %</span></div></div><div class="era5-cell"><div class="era5-label">100–289 cm</div><div class="era5-value">${era5_100_289!=null?Math.round(era5_100_289*100):'—'}<span class="era5-unit"> %</span></div></div></div></div>`;
    const sarHtml=(sarVV!=null||sarInsar!=null)?`<div class="sar-section"><div class="sar-title">RADAR SAR — SENTINEL-1 C-BAND <span class="sar-date">${sarFecha?'img '+sarFecha:''}</span></div><div class="sar-grid"><div class="sar-cell ${vvCls}"><div class="sar-cell-label">COMPACT. VV</div><div class="sar-cell-val">${sarVV!=null?sarVV.toFixed(1):'—'}<span class="sar-cell-unit"> dB</span></div><div class="sar-cell-status" style="color:${_sarCellColor(vvCls)}">${vvLbl}</div></div><div class="sar-cell ${chgCls}"><div class="sar-cell-label">CAMBIO 6d</div><div class="sar-cell-val">${sarChange!=null?(sarChange>=0?'+':'')+sarChange.toFixed(1):'—'}<span class="sar-cell-unit"> dB</span></div><div class="sar-cell-status" style="color:${_sarCellColor(chgCls)}">${chgLbl}</div></div><div class="sar-cell ${insarCls}"><div class="sar-cell-label">INSAR DESPL.</div><div class="sar-cell-val">${sarInsar!=null?(sarInsar>=0?'+':'')+sarInsar.toFixed(1):'—'}<span class="sar-cell-unit"> mm</span></div><div class="sar-cell-status" style="color:${_sarCellColor(insarCls)}">${insarLbl}</div></div></div></div>`:'';

let _sarChart=null;
async function loadSarChart(){
    const wrap=document.getElementById('sarChartWrap');
    if(!wrap)return;
    try{
        const r=await fetch('https://faroprotocol-production-45fd.up.railway.app/velez/panel-data?timeseries=true',{cache:'no-cache'});
        if(!r.ok)return;
        const d=await r.json();
        const vvSeries=(d.sar_vv_series||[]).filter(v=>v!=null);
        const hasValidData=vvSeries.length>=2&&new Set(vvSeries).size>1;
        if(!hasValidData){
            wrap.innerHTML=`<div style="padding:10px 16px;background:rgba(245,158,11,0.07);border-left:2px solid #f59e0b;"><div style="font-size:8px;font-weight:700;letter-spacing:0.8px;color:#f59e0b;text-transform:uppercase;margin-bottom:3px;">SAR SENTINEL-1 — SIN DATOS REALES AUN</div><div style="font-size:8px;color:var(--dim);line-height:1.5;">Esperando pipeline automatico · NASA_EARTHDATA pendiente en Railway.<br>El gráfico aparecerá automáticamente cuando haya datos reales.</div></div>`;
            wrap.dataset.loaded='1';wrap.style.display=_activeCanchaId==='amalfitani'?'block':'none';
            return;
        }
        wrap.innerHTML=`<div class="sar-chart-title">SAR VV — COMPACTACIÓN HISTÓRICA (180 días)</div><canvas id="sarTrendChart"></canvas>`;
        wrap.dataset.loaded='1';wrap.style.display=_activeCanchaId==='amalfitani'?'block':'none';
        const ctx=document.getElementById('sarTrendChart')?.getContext('2d');
        if(!ctx)return;
        if(_sarChart){_sarChart.destroy();_sarChart=null;}
        _sarChart=new Chart(ctx,{
            type:'line',
            data:{labels:d.sar_dates,datasets:[{label:'SAR VV (dB)',data:d.sar_vv_series,borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,0.08)',borderWidth:1.5,tension:0.3,fill:true,pointRadius:2,pointBackgroundColor:'#c9a84c'}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Tendencia SAR VV — últimos 180 días',color:'#c9a84c',font:{family:'Cormorant Garamond',size:11}}},scales:{y:{ticks:{color:'#7a7670',font:{size:8}},grid:{color:'rgba(201,168,76,0.08)'}},x:{ticks:{color:'#7a7670',font:{size:8},maxTicksLimit:7},grid:{display:false}}}}
        });
    }catch(e){
        wrap.innerHTML=`<div style="padding:10px 16px;background:rgba(239,68,68,0.06);border-left:2px solid var(--red);"><div style="font-size:8px;font-weight:700;color:var(--red);">Error cargando SAR histórico</div></div>`;
        wrap.style.display='block';
        console.warn('SAR chart:',e);
    }
}

function updateHeader(){
    const el=document.getElementById('panelSync');if(!el)return;
    const wl=_data?.weather_summary||{},ts=wl.timestamp?new Date(wl.timestamp).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'-',gen=_data?.generated_at?new Date(_data.generated_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'-';

async function init(raw){
    try{
        if(!raw){const res=await fetch(ENDPOINT,{cache:'no-cache'});if(!res.ok)throw new Error(`HTTP ${res.status}`);raw=await res.json();}
        _data=raw;updateHeader();buildTabs();
        const firstId=Object.keys(_data.canchas||{})[0];if(firstId){_activeZoneId='GK_N';activateCancha(firstId);}
        loadSarChart();loadSarGrid();
    }catch(e){console.error('Prescription panel error:',e);const body=document.getElementById('panelBody');if(body)body.innerHTML=`<div style="padding:20px 16px;color:#ef4444;font-size:10px;">Error cargando prescripciones - reintentando en 5 min<br><span style="opacity:0.5;font-size:9px">${e}</span></div>`;}
}
async function pollLoop(){
    try{const res=await fetch(ENDPOINT,{cache:'no-cache'});if(res.ok){_data=await res.json();updateHeader();if(_activeCanchaId)activateCancha(_activeCanchaId);loadSarChart();loadSarGrid();}}
    catch(e){console.warn('Poll:',e);}
    setTimeout(pollLoop,POLL_MS);
}
window.onload=async()=>{await init();setTimeout(pollLoop,POLL_MS);};
