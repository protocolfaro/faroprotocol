<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Faro &middot; Velez</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c;
  --bg2:#0e1218;
  --gold:#c9a84c;
  --whi:#f0ece4;
  --dim:#8a8580;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  display:grid;
  grid-template-rows:50px 1fr;
  color:var(--whi);
  font-family:'Epilogue',sans-serif;
}

/* ── NAV ──────────────────────────────────────────────────────────────────── */
.nav{
  display:flex;
  align-items:center;
  gap:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  padding:0 12px;
  border-bottom:1px solid rgba(201,168,76,.14);
  background:var(--bg);
}
.nav::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  color:var(--dim);
  font-family:'Epilogue',sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:0 11px;
  height:50px;
  white-space:nowrap;
  cursor:pointer;
  transition:color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.tab:hover{color:var(--whi)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── MAIN GRID ────────────────────────────────────────────────────────────── */
.main{
  display:grid;
  grid-template-rows:55fr 30fr 15fr;
  padding:12px 14px 8px;
  gap:10px;
  overflow:hidden;
}

/* ── ELEMENT 1: CAMPO SVG ─────────────────────────────────────────────────── */
.field-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  min-height:0;
}
.field-svg{
  display:block;
  width:auto;
  height:100%;
  max-width:100%;
}
.zone{
  transition:fill 200ms ease;
}

/* ── ELEMENT 2: LA ORDEN ──────────────────────────────────────────────────── */
.orden-box{
  background:var(--bg2);
  border:1px solid var(--gold);
  padding:13px 16px;
  display:flex;
  align-items:center;
  overflow:hidden;
  min-height:0;
}
#orden{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;
  font-weight:700;
  color:var(--whi);
  line-height:1.35;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
}

/* ── ELEMENT 3: DOS NUMEROS ───────────────────────────────────────────────── */
.nums-row{
  display:flex;
  align-items:center;
  min-height:0;
}
#nums{
  font-size:13px;
  font-weight:400;
  color:var(--dim);
  letter-spacing:.04em;
}
</style>
</head>
<body>

<!-- NAV TABS -->
<nav class="nav">
  <button class="tab active" onclick="switchCancha('amalfitani',this)">Amalfitani</button>
  <button class="tab" onclick="switchCancha('1fp',this)">1FP</button>
  <button class="tab" onclick="switchCancha('2fp',this)">2FP</button>
  <button class="tab" onclick="switchCancha('1fa',this)">1FA</button>
  <button class="tab" onclick="switchCancha('2fa',this)">2FA</button>
  <button class="tab" onclick="switchCancha('3fa',this)">3FA</button>
  <button class="tab" onclick="switchCancha('4fa',this)">4FA</button>
  <button class="tab" onclick="switchCancha('5fa',this)">5FA</button>
  <button class="tab" onclick="switchCancha('6fa',this)">6FA</button>
  <button class="tab" onclick="switchCancha('7fa',this)">7FA</button>
  <button class="tab" onclick="switchCancha('8fa',this)">8FA</button>
  <button class="tab" onclick="switchCancha('9fa',this)">9FA</button>
  <button class="tab" onclick="switchCancha('10fa',this)">10FA</button>
</nav>

<main class="main">

  <!-- ELEMENT 1: SVG FIELD -->
  <div class="field-wrap">
    <!--
      ViewBox 210x300 — campo en retrato (3 filas x 2 cols)
      Norte = arriba (y=0..100), Central = medio (y=100..200), Sur = abajo (y=200..300)
      Izquierda = x=0..105, Derecha = x=105..210
    -->
    <svg class="field-svg" viewBox="0 0 210 300"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet">

      <!-- 6 COLOR ZONES -->
      <rect class="zone" id="znw" x="0"   y="0"   width="105" height="100" fill="#1c3318"/>
      <rect class="zone" id="zne" x="105" y="0"   width="105" height="100" fill="#1c3318"/>
      <rect class="zone" id="zcw" x="0"   y="100" width="105" height="100" fill="#1c3318"/>
      <rect class="zone" id="zce" x="105" y="100" width="105" height="100" fill="#1c3318"/>
      <rect class="zone" id="zsw" x="0"   y="200" width="105" height="100" fill="#1c3318"/>
      <rect class="zone" id="zse" x="105" y="200" width="105" height="100" fill="#1c3318"/>

      <!-- FIELD MARKINGS — thin white, semi-transparent -->
      <!-- Outer border -->
      <rect x="1" y="1" width="208" height="298"
            fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.2"/>
      <!-- Halfway line -->
      <line x1="1" y1="150" x2="209" y2="150"
            stroke="rgba(255,255,255,.22)" stroke-width="1"/>
      <!-- Centre circle -->
      <circle cx="105" cy="150" r="26"
              fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>
      <!-- Centre spot -->
      <circle cx="105" cy="150" r="2" fill="rgba(255,255,255,.25)"/>

      <!-- Penalty area — Norte -->
      <rect x="42" y="1" width="126" height="44"
            fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
      <!-- Goal area — Norte -->
      <rect x="65" y="1" width="80" height="17"
            fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
      <!-- Penalty spot — Norte -->
      <circle cx="105" cy="35" r="1.8" fill="rgba(255,255,255,.22)"/>
      <!-- Penalty arc — Norte (outside box) -->
      <path d="M 74,45 A 32,32 0 0,0 136,45"
            fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>

      <!-- Penalty area — Sur -->
      <rect x="42" y="255" width="126" height="44"
            fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
      <!-- Goal area — Sur -->
      <rect x="65" y="282" width="80" height="17"
            fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
      <!-- Penalty spot — Sur -->
      <circle cx="105" cy="265" r="1.8" fill="rgba(255,255,255,.22)"/>
      <!-- Penalty arc — Sur (outside box) -->
      <path d="M 74,255 A 32,32 0 0,1 136,255"
            fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>

      <!-- Corner arcs -->
      <path d="M 1,8 A 7,7 0 0,1 8,1"
            fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1"/>
      <path d="M 202,1 A 7,7 0 0,1 209,8"
            fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1"/>
      <path d="M 1,292 A 7,7 0 0,0 8,299"
            fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1"/>
      <path d="M 202,299 A 7,7 0 0,0 209,292"
            fill="none" stroke="rgba(255,255,255,.11)" stroke-width="1"/>

      <!-- Zone divider line (vertical centre) — subtle, thin -->
      <line x1="105" y1="1" x2="105" y2="299"
            stroke="rgba(255,255,255,.07)" stroke-width=".8"/>
      <!-- Zone divider lines (horizontal thirds) -->
      <line x1="1" y1="100" x2="209" y2="100"
            stroke="rgba(255,255,255,.07)" stroke-width=".8"/>
      <line x1="1" y1="200" x2="209" y2="200"
            stroke="rgba(255,255,255,.07)" stroke-width=".8"/>
    </svg>
  </div>

  <!-- ELEMENT 2: LA ORDEN -->
  <div class="orden-box">
    <p id="orden">El sistema esta analizando los datos de esta madrugada.</p>
  </div>

  <!-- ELEMENT 3: DOS NUMEROS -->
  <div class="nums-row">
    <span id="nums"></span>
  </div>

</main>

<script>
/* ── CONFIG ──────────────────────────────────────────────────────────────── */
const ENDPOINT = 'https://faroprotocol-production-45fd.up.railway.app/velez/panel-roger';
const FALLBACK  = '../velez_data.json';

const ESTADO_COLORS = {
  normal:           '#1c3318',
  stress_hidrico:   'rgba(212,160,23,.35)',
  resiembra_activa: 'rgba(217,79,79,.40)',
  compactacion:     'rgba(139,69,19,.35)',
  fungosis:         'rgba(192,132,252,.30)',
};

/* ── STATE ───────────────────────────────────────────────────────────────── */
let _heatmaps = {};   // {cid: {estado_detectado, prescripcion_operativa, ndvi, ...}}
let _canchas  = [];   // array from canchero list (fallback)
let _estadio  = {};   // Amalfitani sector (fallback)
let _weather  = {};
let _active   = 'amalfitani';

/* ── FIELD PAINT ─────────────────────────────────────────────────────────── */
function _colorFor(estado) {
  return ESTADO_COLORS[estado] || '#1c3318';
}

function _paintField(estado) {
  const c = _colorFor(estado || 'normal');
  document.querySelectorAll('.zone').forEach(el => { el.style.fill = c; });
}

/* ── DATA GETTERS ────────────────────────────────────────────────────────── */
function _getHeatmap(cid) {
  return _heatmaps[cid] || {};
}

function _getCancha(cid) {
  // First check canchas list (has prescripcion_operativa injected by backend)
  const found = _canchas.find(c => c.id === cid);
  if (found) return found;
  // Amalfitani lives in estadio sector
  if (cid === 'amalfitani') return _estadio;
  return {};
}

function _getEstado(cid) {
  return _getHeatmap(cid).estado_detectado
      || _getCancha(cid).estado_detectado
      || null;
}

function _getPrescripcion(cid) {
  return _getCancha(cid).prescripcion_operativa
      || _getHeatmap(cid).prescripcion_operativa
      || null;
}

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function _renderNums() {
  const hum  = _weather.humedad_suelo_pct;
  const temp = (_weather.temp_superficie_lst_c != null)
               ? _weather.temp_superficie_lst_c
               : (_weather.temp_suelo_0cm != null ? _weather.temp_suelo_0cm : null);
  const parts = [];
  if (hum  != null) parts.push('HUMEDAD: ' + hum + '%');
  if (temp != null) parts.push('SUPERFICIE: ' + temp + '°C');
  document.getElementById('nums').textContent = parts.join(' · ');
}

function switchCancha(cid, btn) {
  _active = cid;
  // Update tabs
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // Paint field
  _paintField(_getEstado(cid));
  // Prescription
  document.getElementById('orden').textContent =
    _getPrescripcion(cid) || 'El sistema esta analizando los datos de esta madrugada.';
  // Numbers (same weather for all canchas)
  _renderNums();
}

/* ── NORMALISE: handle both endpoint and fallback JSON formats ────────────── */
function _normalise(raw) {
  // Endpoint format: {heatmaps, roger_canchas, weather_live, ...}
  if (raw.heatmaps || raw.roger_canchas) {
    _heatmaps = raw.heatmaps || {};
    _canchas  = raw.roger_canchas || [];
    _estadio  = {};  // not returned by endpoint — use heatmaps['amalfitani']
    _weather  = raw.weather_live || {};
  } else {
    // Full velez_data.json fallback
    _heatmaps = (raw.usuarios && raw.usuarios.roger && raw.usuarios.roger.heatmaps) || {};
    _canchas  = (raw.sectores && raw.sectores.canchero && raw.sectores.canchero.canchas) || [];
    _estadio  = (raw.sectores && raw.sectores.estadio) || {};
    _weather  = raw.weather_live || {};
  }
}

/* ── FETCH ───────────────────────────────────────────────────────────────── */
async function _load() {
  let raw = null;
  try {
    const r = await fetch(ENDPOINT, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    raw = await r.json();
  } catch (_) {
    try {
      const r2 = await fetch(FALLBACK, { cache: 'no-cache' });
      raw = await r2.json();
    } catch (_2) {
      raw = {};
    }
  }
  _normalise(raw);
  switchCancha(_active, null);
}

_load();
</script>
</body>
</html>
