<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faro &middot; Velez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #07090c;
            --gold:   #c9a84c;
            --whi:    #f0ece4;
            --dim:    #8a8580;
            --red:    #d94f4f;
            --yellow: #d4a017;
            --green:  #4a9e6a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--whi);
            font-family: 'Epilogue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TABS */
        .tabs-container {
            flex-shrink: 0;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            background: rgba(25,30,38,.5);
            border-bottom: 1px solid rgba(255,255,255,.05);
            padding: 10px 8px;
            -webkit-overflow-scrolling: touch;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            display: inline-block;
            padding: 7px 14px;
            margin-right: 6px;
            background: transparent;
            border: 1px solid rgba(255,255,255,.1);
            color: var(--dim);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Epilogue', sans-serif;
        }
        .tab-btn.active {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
        }

        /* HEATMAP */
        .viewport-map {
            flex: 0 0 52vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 310px;
            aspect-ratio: 68 / 105;
            background: #09110d;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .field-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* PRESCRIPCIÓN CARD */
        .presc-card {
            flex: 1;
            min-height: 0;
            background: rgba(15,20,28,.97);
            border-top: 1px solid rgba(255,255,255,.07);
            border-radius: 22px 22px 0 0;
            padding: 20px 22px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 -8px 28px rgba(0,0,0,.4);
        }

        .presc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .zona-nombre {
            font-size: 15px;
            font-weight: 600;
            color: var(--whi);
            letter-spacing: -.4px;
        }

        .prioridad-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            letter-spacing: .5px;
        }

        .presc-orden {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            line-height: 1.3;
            color: var(--gold);
            font-weight: 700;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .presc-meta {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,.05);
            padding-top: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="tabs-container" id="tabsCanchas"></div>

<div class="viewport-map">
    <div class="canvas-container">
        <canvas id="heatmapCanvas"></canvas>
        <svg class="field-svg" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="stripes" width="10" height="105" patternUnits="userSpaceOnUse">
                    <rect width="5"  height="105" fill="rgba(255,255,255,.04)"/>
                    <rect x="5" width="5" height="105" fill="rgba(0,0,0,0)"/>
                </pattern>
            </defs>
            <rect width="68" height="105" fill="url(#stripes)"/>
            <rect x="3"    y="3"    width="62"   height="99"   fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".7"/>
            <line x1="3"   y1="52.5" x2="65"  y2="52.5"               stroke="rgba(255,255,255,.22)" stroke-width=".7"/>
            <circle cx="34" cy="52.5" r="9.15"                  fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".7"/>
            <rect x="13.8" y="3"    width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".6"/>
            <rect x="13.8" y="85.5" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width=".6"/>
            <rect x="24.8" y="3"    width="18.4" height="5.5"  fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".5"/>
            <rect x="24.8" y="96.5" width="18.4" height="5.5"  fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".5"/>
        </svg>
    </div>
</div>

<div class="presc-card">
    <div class="presc-header">
        <span class="zona-nombre" id="uiZona">--</span>
        <span class="prioridad-badge" id="uiBadge">--</span>
    </div>
    <div class="presc-orden" id="uiOrden">Cargando telemetria...</div>
    <div class="presc-meta" id="uiMeta">HUMEDAD: -- &middot; SUPERFICIE: --</div>
</div>

<script>
const ENDPOINT = '../velez_data.json';

let _canchas = [];
let _weather = {};
let _activeIdx = 0;

/* ── IDW GAUSSIANO ──────────────────────────────────────────────────────────── */
function _stressToRGB(s) {
    if (s < 0.5) {
        const t = s * 2;
        return [Math.round(t * 180), Math.round(95 + t * 85), Math.round(35 * (1 - t))];
    }
    const t = (s - 0.5) * 2;
    return [Math.round(180 + t * 75), Math.round(180 * (1 - t)), 0];
}

function renderHeatmap(canvas, nodos) {
    const W = 120, H = 185;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(W, H);
    const d   = img.data;
    const POWER = 2.5, SIGMA = 0.25;

    for (let py = 0; py < H; py++) {
        for (let px = 0; px < W; px++) {
            const fx = px / W, fy = py / H;
            let wSum = 0, sSum = 0;
            for (const n of nodos) {
                const dx = fx - n.x, dy = fy - n.y;
                const d2 = dx*dx + dy*dy;
                const w  = Math.exp(-d2 / (2*SIGMA*SIGMA)) / Math.pow(d2 + 1e-9, POWER/2);
                wSum += w; sSum += w * n.stress;
            }
            const stress = wSum > 0 ? Math.min(1, Math.max(0, sSum / wSum)) : 0;
            const [r,g,b] = _stressToRGB(stress);
            const i = (py*W + px) * 4;
            d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=210;
        }
    }
    ctx.putImageData(img, 0, 0);
}

/* ── NODOS SINTÉTICOS desde estado_detectado + ndvi ────────────────────────── */
function nodosDesdeEstado(cancha) {
    const estado = cancha.estado_detectado || 'normal';
    const ndvi   = cancha.ndvi || 0.08;
    const base   = estado === 'resiembra_activa' ? 0.85 :
                   estado === 'stress_hidrico'   ? 0.65 :
                   estado === 'compactacion'     ? 0.70 :
                   estado === 'fungosis'         ? 0.60 :
                   Math.max(0.1, 1 - (ndvi / 0.65));
    return [
        {x: 0.25, y: 0.15, stress: base * 0.70},
        {x: 0.75, y: 0.15, stress: base * 0.65},
        {x: 0.25, y: 0.50, stress: base},
        {x: 0.75, y: 0.50, stress: base * 0.95},
        {x: 0.25, y: 0.85, stress: base * 0.75},
        {x: 0.75, y: 0.85, stress: base * 0.70},
    ];
}

/* ── RENDER CANCHA ──────────────────────────────────────────────────────────── */
function updateUI(cancha) {
    const canvas = document.getElementById('heatmapCanvas');
    const uiZona  = document.getElementById('uiZona');
    const uiBadge = document.getElementById('uiBadge');
    const uiOrden = document.getElementById('uiOrden');
    const uiMeta  = document.getElementById('uiMeta');

    if (!cancha) {
        uiZona.textContent  = 'Estado General';
        uiBadge.textContent = 'ANALIZANDO';
        uiBadge.style.backgroundColor = 'var(--dim)';
        uiOrden.textContent = 'El sistema esta analizando los datos de esta madrugada.';
        uiMeta.textContent  = 'HUMEDAD: -- · SUPERFICIE: --';
        _flatCanvas(canvas);
        return;
    }

    const ze = cancha.zonas_estres;

    /* prescripcion: usar prescripcion_operativa, luego n_rec */
    const presc = cancha.prescripcion_operativa || cancha.n_rec || 'Sin acciones requeridas hoy.';
    uiOrden.textContent = presc;

    /* zona critica y prioridad */
    const zona  = ze ? ze.zona_critica : (cancha.estado_detectado || 'Normal');
    const prio  = ze ? (ze.prioridad || 1) : 1;
    uiZona.textContent  = zona;
    uiBadge.textContent = `PRIORIDAD ${prio}`;
    uiBadge.style.backgroundColor = prio >= 6 ? 'var(--red)' : prio >= 3 ? 'var(--yellow)' : 'var(--green)';

    /* meta */
    const hum  = _weather.humedad_suelo_pct != null ? _weather.humedad_suelo_pct + '%' : '--';
    const temp = _weather.temp_superficie_lst_c != null
                 ? _weather.temp_superficie_lst_c.toFixed(1) + '°C'
                 : _weather.temp_suelo_0cm != null
                   ? _weather.temp_suelo_0cm.toFixed(1) + '°C'
                   : '--';
    uiMeta.textContent = `HUMEDAD: ${hum} · SUPERFICIE: ${temp}`;

    /* heatmap: zonas_estres reales si existen, sintéticos si no */
    const nodos = (ze && ze.nodos && ze.nodos.length > 0)
                  ? ze.nodos
                  : nodosDesdeEstado(cancha);
    renderHeatmap(canvas, nodos);
}

/* ── CANVAS FLAT (fallback vacio) ───────────────────────────────────────────── */
function _flatCanvas(canvas) {
    canvas.width = 120; canvas.height = 185;
    canvas.getContext('2d').clearRect(0, 0, 120, 185);
}

/* ── CARGA ──────────────────────────────────────────────────────────────────── */
async function init() {
    try {
        const r = await fetch(ENDPOINT, { cache: 'no-cache' });
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();

        _weather = data.weather_live || {};

        /* Amalfitani — sede Liniers, viene de sectores.estadio */
        const estadioRaw = data.sectores && data.sectores.estadio;
        const estadio = estadioRaw
            ? [{ ...estadioRaw, id: 'amalfitani', nombre: 'Amalfitani' }]
            : [];

        /* Villa Olímpica — canchas VO */
        const vo = (data.sectores && data.sectores.canchero && data.sectores.canchero.canchas) || [];

        _canchas = [...estadio, ...vo];
        if (_canchas.length === 0) throw new Error('Sin canchas en JSON');

        /* tabs con separador entre venues */
        const tabsEl = document.getElementById('tabsCanchas');
        tabsEl.innerHTML = '';
        _canchas.forEach((c, idx) => {
            if (idx === 1) {
                const sep = document.createElement('span');
                sep.style.cssText = 'display:inline-block;width:1px;height:24px;background:rgba(255,255,255,0.15);margin:0 8px;vertical-align:middle';
                tabsEl.appendChild(sep);
            }
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
            btn.textContent = c.id === 'amalfitani' ? 'AMALFITANI' : (c.id || `Cancha ${idx}`).toUpperCase();
            btn.onclick = () => {
                document.querySelector('.tab-btn.active').classList.remove('active');
                btn.classList.add('active');
                _activeIdx = idx;
                updateUI(_canchas[idx]);
            };
            tabsEl.appendChild(btn);
        });

        updateUI(_canchas[0]);

    } catch (err) {
        console.error('Panel error:', err);
        updateUI(null);
    }
}

window.addEventListener('load', init);
</script>
</body>
</html>
