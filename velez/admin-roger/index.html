<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faro Protocol v2.0 · Vélez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #07090c;
            --gold:    #c9a84c;
            --whi:     #f0ece4;
            --dim:     #8a8580;
            --red:     #d94f4f;
            --yellow:  #d4a017;
            --green:   #4a9e6a;
            --card-bg: rgba(10,14,20,0.97);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--whi);
            font-family: 'Epilogue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            position: relative;
        }

        /* ── TABS ─────────────────────────────────────────────────────────── */
        .nav-tabs {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            max-width: calc(55% - 40px);
            white-space: nowrap;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex-shrink: 0;
            background: rgba(25,30,38,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--dim);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Epilogue', sans-serif;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

        .tab-sep {
            flex-shrink: 0;
            display: inline-block;
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.15);
        }

        /* ── CAMPO 55% ────────────────────────────────────────────────────── */
        .wrapper-field {
            width: 55%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 60px 24px 24px 48px;
        }

        .text-stadium {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: center center;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            white-space: nowrap;
            pointer-events: none;
        }

        .field-container {
            position: relative;
            height: calc(100% - 16px);
            width: auto;
            aspect-ratio: 68 / 105;
            max-width: 100%;
            background: #112916;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .heatmap-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            /* sin mix-blend-mode -- el canvas ya tiene alpha correcto por pixel */
        }

        .field-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .nodes-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .node-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid rgba(0,0,0,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* ── PANEL 45% ────────────────────────────────────────────────────── */
        .panel-control {
            width: 45%;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid rgba(255,255,255,0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .panel-sync {
            font-size: 9px;
            color: var(--dim);
            text-align: right;
            line-height: 1.4;
            font-weight: 600;
        }

        /* ── LISTA AGENTES ────────────────────────────────────────────────── */
        .agents-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 12px;
        }
        .agents-list::-webkit-scrollbar { width: 3px; }
        .agents-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

        .agent-row {
            display: grid;
            grid-template-columns: 90px 1fr 1fr 1fr;
            align-items: start;
            gap: 8px;
            padding: 5px 8px;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 3px;
            transition: all 0.2s;
        }
        .agent-row.active {
            background: rgba(201,168,76,0.07);
            border-color: var(--gold);
        }

        .agent-name {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            font-weight: 600;
            color: var(--whi);
        }
        .agent-row.active .agent-name { color: var(--gold); }

        .agent-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .agent-col {
            font-size: 8px;
            color: var(--dim);
            line-height: 1.35;
        }
        .agent-col > span {
            display: block;
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.3px;
            margin-bottom: 1px;
        }

        /* ── CARD PRESCRIPCIÓN ────────────────────────────────────────────── */
        .presc-box {
            flex-shrink: 0;
            background: rgba(20,10,10,0.95);
            border: 1px solid var(--red);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .presc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .presc-zona {
            font-size: 9px;
            font-weight: 600;
            color: var(--dim);
            letter-spacing: 0.5px;
        }

        .presc-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            background: var(--red);
            color: #fff;
            letter-spacing: 0.5px;
        }

        .presc-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1.3;
        }

        .presc-metrics {
            font-size: 8px;
            font-weight: 600;
            color: var(--dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }

        /* ── MOBILE ───────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .nav-tabs { max-width: calc(100% - 40px); }
            .wrapper-field { width: 100%; height: 52vh; padding: 50px 12px 12px 12px; }
            .field-container { height: 100%; }
            .panel-control { width: 100%; height: auto; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); overflow: visible; }
            .agents-list { max-height: 320px; }
            .text-stadium { display: none; }
        }
    </style>
</head>
<body>

<nav class="nav-tabs" id="tabsCanchas"></nav>

<div class="wrapper-field">
    <div class="text-stadium">Estadio José Amalfitani, Vélez Sarsfield</div>
    <div class="field-container">
        <canvas class="heatmap-overlay" id="heatmapOverlay" style="width:100%;height:100%;"></canvas>
        <svg class="field-svg" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg">
            <defs>

                    <rect width="4"  height="105" fill="rgba(255,255,255,0.03)"/>

            </defs>
            <rect width="68" height="105" fill="url(#lawn)"/>
            <rect x="3"    y="3"    width="62"   height="99"   fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <line x1="3"   y1="52.5" x2="65"   y2="52.5"                  stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <circle cx="34" cy="52.5" r="9.15"                      fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="13.8" y="3"    width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="13.8" y="85.5" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="22"   y="3"    width="24"   height="5.5"  fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>

</div>

<div class="panel-control">

        <div class="panel-title">FARO PROTOCOL v2.0 · CANCHA VÉLEZ</div>
        <div class="panel-sync">
            9:00 UTC<br>
            <span style="font-size:7px;opacity:0.7">SYNC: SAT / RADAR / CLIMA</span>

    <div class="agents-list" id="uiAgentes"></div>

    <div class="presc-box" id="uiPrescBox">
        <div class="presc-header">
            <div class="presc-zona"  id="uiZona">DIAGNÓSTICO: —</div>

        </div>
        <div class="presc-text"    id="uiPrescripcion">Sincronizando telemetría…</div>
        <div class="presc-metrics" id="uiMetrics">HUMEDAD: — | SUPERFICIE: —</div>
    </div>
</div>

<script>
const ENDPOINT = '../velez_data.json';
let dataGlobal = [], wlGlobal = {}, hermesMapGlobal = {};
const POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutos
let lastUpdatedAt = null;

/* ── HEATMAP ENGINE v1.0 — Canvas 2D Gaussian kernel ─────────────────────── */
function buildPalette() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 1;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 256, 0);
    grad.addColorStop(0.00, 'rgba(0,100,0,0)');
    grad.addColorStop(0.20, 'rgba(0,180,0,0.55)');
    grad.addColorStop(0.45, 'rgba(120,220,0,0.75)');
    grad.addColorStop(0.60, 'rgba(255,230,0,0.88)');
    grad.addColorStop(0.75, 'rgba(255,140,0,0.94)');
    grad.addColorStop(0.88, 'rgba(230,40,0,0.97)');
    grad.addColorStop(1.00, 'rgba(160,0,60,1.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 1);
    return ctx.getImageData(0, 0, 256, 1).data;
}

const _PALETTE = buildPalette();

function paletteColor(t) {
    const i = Math.min(255, Math.floor(t * 255)) * 4;
    return [_PALETTE[i], _PALETTE[i+1], _PALETTE[i+2], _PALETTE[i+3]];
}

function renderHeatmap(nodos) {
    const canvas = document.getElementById('heatmapOverlay');
    if (!canvas || !canvas.getContext) return;

    const W = canvas.offsetWidth  || canvas.parentElement.offsetWidth;
    const H = canvas.offsetHeight || canvas.parentElement.offsetHeight;
    if (W === 0 || H === 0) return;

    canvas.width  = W;
    canvas.height = H;

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    if (!nodos || nodos.length === 0) return;

    const buf = new Float32Array(W * H);
    const SIGMA_X  = W * 0.18;
    const SIGMA_Y  = H * 0.18;
    const SIGMA2_X = 2 * SIGMA_X * SIGMA_X;
    const SIGMA2_Y = 2 * SIGMA_Y * SIGMA_Y;

    for (const n of nodos) {
        const cx  = n.x * W;
        const cy  = n.y * H;
        const amp = n.stress;
        const x0  = Math.max(0, Math.floor(cx - 3 * SIGMA_X));
        const x1  = Math.min(W - 1, Math.ceil(cx + 3 * SIGMA_X));
        const y0  = Math.max(0, Math.floor(cy - 3 * SIGMA_Y));
        const y1  = Math.min(H - 1, Math.ceil(cy + 3 * SIGMA_Y));

        for (let y = y0; y <= y1; y++) {
            for (let x = x0; x <= x1; x++) {
                const dx = x - cx, dy = y - cy;
                buf[y * W + x] += amp * Math.exp(-(dx*dx/SIGMA2_X + dy*dy/SIGMA2_Y));
            }
        }
    }

    let maxVal = 0;
    for (let i = 0; i < buf.length; i++) if (buf[i] > maxVal) maxVal = buf[i];
    if (maxVal === 0) return;

    const imgData = ctx.createImageData(W, H);
    const px = imgData.data;
    for (let i = 0; i < buf.length; i++) {
        const t = buf[i] / maxVal;
        const [r, g, b, a] = paletteColor(t);
        const idx = i * 4;
        px[idx] = r; px[idx+1] = g; px[idx+2] = b; px[idx+3] = a;
    }
    ctx.putImageData(imgData, 0, 0);
}

let _animFrame = null;
let _nodosActuales = null;

function renderHeatmapAnimado(nodosNuevos, duracionMs = 600) {
    if (_animFrame) cancelAnimationFrame(_animFrame);

    const canvas = document.getElementById('heatmapOverlay');
    if (!canvas) { renderHeatmap(nodosNuevos); return; }

    const nodosViejos = _nodosActuales
        ? JSON.parse(JSON.stringify(_nodosActuales))
        : nodosNuevos.map(n => ({ ...n, stress: 0 }));

    const t0 = performance.now();

    function frame(now) {
        const progress = Math.min(1, (now - t0) / duracionMs);
        const ease = 1 - Math.pow(1 - progress, 3);
        const nodosInterp = nodosNuevos.map((n, i) => {
            const old = nodosViejos[i] || { ...n, stress: 0 };
            return { ...n, stress: old.stress + (n.stress - old.stress) * ease };
        });
        renderHeatmap(nodosInterp);
        if (progress < 1) {
            _animFrame = requestAnimationFrame(frame);
        } else {
            _nodosActuales = nodosNuevos;
            _animFrame = null;
        }
    }
    _animFrame = requestAnimationFrame(frame);
}

window.addEventListener('resize', () => {
    if (_nodosActuales) renderHeatmap(_nodosActuales);
});

/* ── NODOS POR CANCHA ─────────────────────────────────────────────────────── */
function nodosDesdeCancha(cancha) {
    if (cancha.zonas_estres?.nodos) return cancha.zonas_estres.nodos;
    const ndvi   = cancha.ndvi || 0.08;
    const estado = cancha.estado_detectado || 'normal';
    const s = estado === 'resiembra_activa' ? 0.90 :
              estado === 'stress_hidrico'   ? 0.70 :
              estado === 'compactacion'     ? 0.75 :
              estado === 'fungosis'         ? 0.65 :
              Math.max(0.08, Math.min(0.95, 1 - (ndvi / 0.65)));
    const v = ((cancha.id?.charCodeAt(0) || 50) % 10) / 40;
    return [
        { x: 0.25, y: 0.15, stress: Math.min(1, s * 0.75 + v)       },
        { x: 0.75, y: 0.15, stress: Math.min(1, s * 0.70 + v * 0.8) },
        { x: 0.25, y: 0.50, stress: Math.min(1, s       + v * 0.5)  },
        { x: 0.75, y: 0.50, stress: Math.min(1, s * 0.95 + v * 0.6) },
        { x: 0.25, y: 0.85, stress: Math.min(1, s * 0.80 + v * 0.7) },
        { x: 0.75, y: 0.85, stress: Math.min(1, s * 0.75 + v * 0.9) },
    ];
}

/* ── PIPELINE AGENTES ─────────────────────────────────────────────────────── */
function buildAgentPipeline(zonaCritica, prioridad, prescripcion, wl, hermesStatus, hermesConfianza, hermesFuente, hermesUmbral) {
    const ndvi   = wl.gndvi_por_cancha?.canchas?.['1fa']?.ndvi || 0.06;
    const fuente = (wl.gndvi_por_cancha?.fuente || 'Sentinel-2').split('·')[0].trim();
    const sm     = wl.humedad_suelo_pct   || 43;
    const et0    = wl.et0_mm_dia          || 0.6;
    const ds     = wl.riesgo_dollar_spot_pct || 30;
    const hora   = wl.hora_riego_optima   || '05:00';
    const activo = prioridad >= 3;

    return [
        { n:'Optico',        s:`NDVI=${ndvi.toFixed(3)} via ${fuente}`,  w:'Coherencia optica validada',       q:'Base calculo estres foliar'    },
        { n:'HLS/MODIS',     s:'Fusion multi-fuente diaria',              w:'Sin nubes garantizado',            q:'Cobertura 1–3 dias'            },
        { n:'SAR Nacional',  s:'Sentinel-1C/D + SAOCOM L-band',          w:'Cobertura radar Argentina',        q:'Backscatter HH/HV activo'      },
        { n:'Hidrologia',    s:`SM=${sm.toFixed(0)}% superficie`,         w:'Humedad subsuperficial real',      q:'Perfil Van Genuchten'          },
        { n:'Filtro',        s:'Suavizado Stanford 4-vecinos',            w:'Reduccion ruido SAR',              q:'Señal limpia garantizada'      },
        { n:'Fungosis',      s:`Dollar Spot ${ds.toFixed(0)}% riesgo`,    w:'Clima favorable infeccion',        q:'Alerta preventiva activa'      },
        { n:'Interpolacion', s:'IDW Gaussiano 6 nodos',                   w:'Heatmap espacial calibrado',       q:'Resolucion efectiva 10m'       },
        { n:'ET0',           s:`${et0.toFixed(1)} mm/dia`,                w:'Penman-Monteith FAO-56',           q:`Riego optimo ${hora}`          },
        { n:'Render',        s:'Gradiente radial CSS GPU',                w:'Mix-blend hard-light nativo',      q:'Contraste termico maximo'      },
        { n:'Motor Faro · Hermes',
          s: hermesStatus === 'ALERTA_ANOMALIA' ? `⚠ ALERTA — umbral ${hermesUmbral?.toFixed(3) || '—'}` :
             hermesStatus === 'INDETERMINADO'   ? 'INDETERMINADO — sin dato suficiente' :
             hermesStatus === 'NOMINAL_GREEN'   ? `NOMINAL — umbral ${hermesUmbral?.toFixed(3) || '—'}` :
             activo ? `ALERTA: ${zonaCritica}` : 'Normal',
          w: hermesConfianza ? `Confianza ${hermesConfianza}` : prescripcion?.split('--')[0]?.trim() || 'Síntesis completada',
          q: hermesFuente    ? `Fuente: ${hermesFuente}`      : prescripcion?.split('--')[1]?.trim() || 'Sin acciones urgentes',
          activo: hermesStatus === 'ALERTA_ANOMALIA' || activo },
        { n:'INTA',          s:'CC=0.32 pampeana',                        w:'Capacidad de Campo Balcarce',      q:'Balance hidrico calibrado'     },
        { n:'USDA/FAO',      s:'Penman-Monteith FAO-56',                  w:'Estandar internacional ET0',       q:'Validado NASA POWER'           },
        { n:'Copernicus',    s:'ESA Sentinel / NASA HLS',                 w:'Fuentes satelitales oficiales',    q:'Datos verificados SHA-256'     },
    ];
}

/* ── SYNC ─────────────────────────────────────────────────────────────────── */
function syncPanelData(cancha, wl, hermesMap = {}) {
    const hm              = hermesMap[cancha.id] || {};
    const hermesStatus    = hm.hermes_status         || null;
    const hermesConfianza = hm.hermes_confianza       || null;
    const hermesFuente    = hm.hermes_ndvi_fuente     || null;
    const hermesUmbral    = hm.hermes_umbral_dinamico || null;

    const nodos = nodosDesdeCancha(cancha);

    // Si Hermes dice ALERTA, amplificar el stress de todos los nodos
    let nodosFinales = nodos;
    if (hermesStatus === 'ALERTA_ANOMALIA') {
        nodosFinales = nodos.map(n => ({ ...n, stress: Math.min(1, n.stress * 1.35) }));
    } else if (hermesStatus === 'INDETERMINADO') {
        // Nodo central gris pulsante como indicador de dato faltante
        nodosFinales = [...nodos, { x: 0.5, y: 0.5, stress: 0.28 }];
    }
    renderHeatmapAnimado(nodosFinales, 500);

    const nodesEl = document.getElementById('nodesOverlay');
    nodesEl.innerHTML = '';
    nodos.forEach(n => {
        const dot = document.createElement('div');
        dot.className = 'node-dot';
        dot.style.left = `${n.x * 100}%`;
        dot.style.top  = `${n.y * 100}%`;
        nodesEl.appendChild(dot);
    });

    const ze           = cancha.zonas_estres;
    const zonaCritica  = ze?.zona_critica || cancha.estado_detectado || 'Normal';
    const prioridad    = ze?.prioridad    || 1;
    const prescripcion = cancha.prescripcion_operativa || cancha.n_rec || 'Sin acciones requeridas hoy.';

    document.getElementById('uiZona').textContent        = `DIAGNÓSTICO: ${zonaCritica.toUpperCase()}`;
    document.getElementById('uiPrescripcion').textContent = prescripcion;

    const badge = document.getElementById('uiBadge');
    const box   = document.getElementById('uiPrescBox');
    badge.textContent = `PRIORIDAD ${prioridad}`;
    if (prioridad >= 6) {
        badge.style.background = 'var(--red)';    box.style.borderColor = 'var(--red)';
    } else if (prioridad >= 3) {
        badge.style.background = 'var(--yellow)'; box.style.borderColor = 'var(--yellow)';
    } else {
        badge.style.background = 'var(--green)';  box.style.borderColor = 'rgba(255,255,255,0.1)';
    }

    const sm  = wl.humedad_suelo_pct?.toFixed(0)    || '43';
    const lst = wl.temp_superficie_lst_c?.toFixed(1) || wl.temp_suelo_0cm?.toFixed(1) || '11.1';
    const hermesLine = hermesStatus
        ? ` | HERMES: ${hermesStatus === 'NOMINAL_GREEN' ? 'OK' : hermesStatus === 'ALERTA_ANOMALIA' ? '⚠ ALERTA' : '—'} conf:${hermesConfianza || '—'}`
        : '';
    document.getElementById('uiMetrics').textContent =
        `HUMEDAD: ${sm}% | SUPERFICIE: ${lst}°C${hermesLine}`;

    const agents   = buildAgentPipeline(zonaCritica, prioridad, prescripcion, wl, hermesStatus, hermesConfianza, hermesFuente, hermesUmbral);
    const listEl   = document.getElementById('uiAgentes');
    listEl.innerHTML = '';
    agents.forEach(ag => {
        const row = document.createElement('div');
        row.className = 'agent-row' + (ag.activo ? ' active' : '');
        const clr = ag.activo ? 'var(--gold)' : '#4a9e6a';
        row.innerHTML = `
            <div class="agent-name">
                <div class="agent-dot" style="background:${clr};box-shadow:0 0 5px ${clr}"></div>
                ${ag.n}
            </div>
            <div class="agent-col"><span>Paso a Paso</span>${ag.s}</div>
            <div class="agent-col"><span>Por Qué</span>${ag.w}</div>
            <div class="agent-col"><span>Para Qué</span>${ag.q}</div>
        `;
        listEl.appendChild(row);
    });
}

/* ── INIT ─────────────────────────────────────────────────────────────────── */
async function masterInit(data = null) {
    try {
        if (!data) {
            const res = await fetch(ENDPOINT, { cache: 'no-cache' });
            data = await res.json();
        }
        wlGlobal       = data.weather_live || {};
        hermesMapGlobal = data.usuarios?.roger?.heatmaps || {};

        const estadio = data.sectores?.estadio
            ? [{
                ...data.sectores.estadio,
                ...(data.usuarios?.roger?.heatmaps?.amalfitani || {}),
                id: 'amalfitani',
                nombre: 'Amalfitani'
              }]
            : [];
        const vo = data.sectores?.canchero?.canchas || [];
        dataGlobal = [...estadio, ...vo];
        if (dataGlobal.length === 0) throw new Error('Sin canchas');

        const tabsEl = document.getElementById('tabsCanchas');
        tabsEl.innerHTML = '';
        dataGlobal.forEach((c, i) => {
            if (i === 1 && estadio.length > 0) {
                const sep = document.createElement('span');
                sep.className = 'tab-sep';
                tabsEl.appendChild(sep);
            }
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
            btn.textContent = c.id === 'amalfitani' ? 'AMALFITANI' : (c.id || '').toUpperCase();
            btn.onclick = () => {
                tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                syncPanelData(c, wlGlobal, hermesMapGlobal);
            };
            tabsEl.appendChild(btn);
        });

        syncPanelData(dataGlobal[0], wlGlobal, hermesMapGlobal);

    } catch (err) {
        console.error('Panel error:', err);
        document.getElementById('uiPrescripcion').textContent = 'Error cargando telemetría.';
    }
}

async function pollLoop() {
    try {
        const res  = await fetch(ENDPOINT, { cache: 'no-cache' });
        const data = await res.json();
        const serverTs = data.updated_at;

        if (serverTs !== lastUpdatedAt) {
            lastUpdatedAt = serverTs;
            await masterInit(data);
            updateSyncBadge(serverTs, true);
        } else {
            updateSyncBadge(serverTs, false);
        }
    } catch (err) {
        console.error('Poll error:', err);
    }
    setTimeout(pollLoop, POLL_INTERVAL_MS);
}

function updateSyncBadge(ts, isNew) {
    const el = document.querySelector('.panel-sync');
    if (!el) return;
    const fecha = ts ? new Date(ts) : new Date();
    const hace  = Math.round((Date.now() - fecha.getTime()) / 60000);
    el.innerHTML = `
        ${fecha.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})} UTC<br>
        <span style="font-size:7px;opacity:0.7">
            ${isNew ? '🟢 ACTUALIZADO' : `hace ${hace} min`} · SAT/RADAR/CLIMA
        </span>`;
}

window.onload = pollLoop;
</script>
