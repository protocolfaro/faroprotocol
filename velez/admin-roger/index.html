<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faro Protocol v2.0 · Vélez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Epilogue:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #07090c;
            --gold:    #c9a84c;
            --whi:     #f0ece4;
            --dim:     #8a8580;
            --red:     #d94f4f;
            --yellow:  #d4a017;
            --green:   #4a9e6a;
            --card-bg: rgba(10,14,20,0.97);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--whi);
            font-family: 'Epilogue', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            position: relative;
        }

        /* ── TABS ─────────────────────────────────────────────────────────── */
        .nav-tabs {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            max-width: calc(55% - 40px);
            white-space: nowrap;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex-shrink: 0;
            background: rgba(25,30,38,0.75);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--dim);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Epilogue', sans-serif;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

        .tab-sep {
            flex-shrink: 0;
            display: inline-block;
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.15);
        }

        /* ── CAMPO 55% ────────────────────────────────────────────────────── */
        .wrapper-field {
            width: 55%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 60px 24px 24px 48px;
        }

        .text-stadium {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: center center;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            white-space: nowrap;
            pointer-events: none;
        }

        .field-container {
            position: relative;
            height: calc(100% - 16px);
            width: auto;
            aspect-ratio: 68 / 105;
            max-width: 100%;
            background: #112916;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .heatmap-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            /* sin mix-blend-mode -- el canvas ya tiene alpha correcto por pixel */
        }

        .field-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .nodes-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .node-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border: 2px solid rgba(0,0,0,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* ── PANEL 45% ────────────────────────────────────────────────────── */
        .panel-control {
            width: 45%;
            height: 100%;
            background: var(--card-bg);
            border-left: 1px solid rgba(255,255,255,0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
        }

        .panel-sync {
            font-size: 9px;
            color: var(--dim);
            text-align: right;
            line-height: 1.4;
            font-weight: 600;
        }

        /* ── LISTA AGENTES ────────────────────────────────────────────────── */
        .agents-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 12px;
        }
        .agents-list::-webkit-scrollbar { width: 3px; }
        .agents-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

        .agent-row {
            display: grid;
            grid-template-columns: 90px 1fr 1fr 1fr;
            align-items: start;
            gap: 8px;
            padding: 5px 8px;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 3px;
            transition: all 0.2s;
        }
        .agent-row.active {
            background: rgba(201,168,76,0.07);
            border-color: var(--gold);
        }

        .agent-name {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            font-weight: 600;
            color: var(--whi);
        }
        .agent-row.active .agent-name { color: var(--gold); }

        .agent-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .agent-col {
            font-size: 8px;
            color: var(--dim);
            line-height: 1.35;
        }
        .agent-col > span {
            display: block;
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.3px;
            margin-bottom: 1px;
        }

        /* ── CARD PRESCRIPCIÓN ────────────────────────────────────────────── */
        .presc-box {
            flex-shrink: 0;
            background: rgba(20,10,10,0.95);
            border: 1px solid var(--red);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .presc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .presc-zona {
            font-size: 9px;
            font-weight: 600;
            color: var(--dim);
            letter-spacing: 0.5px;
        }

        .presc-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            background: var(--red);
            color: #fff;
            letter-spacing: 0.5px;
        }

        .presc-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1.3;
        }

        .presc-metrics {
            font-size: 8px;
            font-weight: 600;
            color: var(--dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }

        /* ── MOBILE ───────────────────────────────────────────────────────── */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .nav-tabs { max-width: calc(100% - 40px); }
            .wrapper-field { width: 100%; height: 52vh; padding: 50px 12px 12px 12px; }
            .field-container { height: 100%; }
            .panel-control { width: 100%; height: auto; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); overflow: visible; }
            .op-card { max-height: 380px; }
            .text-stadium { display: none; }
        }

        /* ── HEATMAP STATUS BADGE ─────────────────────────────────────────── */
        .hm-status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 10;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.8px;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
            pointer-events: none;
            background: #44aa44;
        }

        /* ── OPERATIONAL CARD ────────────────────────────────────────────── */
        .op-card {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0;
        }
        .op-card::-webkit-scrollbar { width: 3px; }
        .op-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

        .op-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .op-cancha-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--gold);
        }
        .op-estado-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.8px;
            color: #fff;
        }

        .op-rows { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .op-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 7px 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
            border-left: 2px solid rgba(255,255,255,0.08);
        }
        .op-row.urgente { border-left-color: var(--red); background: rgba(217,79,79,0.06); }
        .op-row.alerta  { border-left-color: var(--yellow); }
        .op-row.ok      { border-left-color: var(--green); }
        .op-row-label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--dim);
            width: 88px;
            flex-shrink: 0;
            padding-top: 1px;
        }
        .op-row-value {
            font-size: 10px;
            font-weight: 600;
            color: var(--whi);
            line-height: 1.35;
        }

        .op-actions {
            background: rgba(10,14,20,0.95);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 6px;
            padding: 10px 12px;
            flex-shrink: 0;
        }
        .op-actions-title {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--dim);
            margin-bottom: 8px;
        }
        .op-action-item {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .op-action-item:last-child { margin-bottom: 0; }
        .op-action-num {
            font-size: 8px;
            font-weight: 700;
            color: var(--gold);
            background: rgba(201,168,76,0.12);
            padding: 1px 5px;
            border-radius: 3px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .op-action-text {
            font-size: 10px;
            color: var(--whi);
            font-weight: 500;
        }
    </style>
</head>
<body>

<nav class="nav-tabs" id="tabsCanchas"></nav>

<div class="wrapper-field">
    <div class="text-stadium">Estadio José Amalfitani, Vélez Sarsfield</div>
    <div class="field-container">
        <canvas class="heatmap-overlay" id="heatmapOverlay" style="width:100%;height:100%;"></canvas>
        <svg class="field-svg" viewBox="0 0 68 105" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="lawn" width="8" height="105" patternUnits="userSpaceOnUse">
                    <rect width="4"  height="105" fill="rgba(255,255,255,0.03)"/>
                    <rect x="4" width="4" height="105" fill="rgba(0,0,0,0.01)"/>
                </pattern>
            </defs>
            <rect width="68" height="105" fill="url(#lawn)"/>
            <rect x="3"    y="3"    width="62"   height="99"   fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <line x1="3"   y1="52.5" x2="65"   y2="52.5"                  stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <circle cx="34" cy="52.5" r="9.15"                      fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="13.8" y="3"    width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="13.8" y="85.5" width="40.4" height="16.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="22"   y="3"    width="24"   height="5.5"  fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
            <rect x="22"   y="96.5" width="24"   height="5.5"  fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>
        </svg>
        <div class="nodes-overlay" id="nodesOverlay"></div>
        <div class="hm-status-badge" id="hmStatusBadge">—</div>
    </div>
</div>

<div class="panel-control">
    <div class="panel-header">
        <div class="panel-title">FARO PROTOCOL v2.0 · CANCHA VÉLEZ</div>
        <div class="panel-sync">
            9:00 UTC<br>
            <span style="font-size:7px;opacity:0.7">SYNC: SAT / RADAR / CLIMA</span>
        </div>
    </div>

    <div class="op-card" id="uiOpCard"></div>
</div>

<script>
const ENDPOINT = 'https://faroprotocol-production-45fd.up.railway.app/velez/panel-data';
let dataGlobal = [], wlGlobal = {}, hermesMapGlobal = {};
const POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 minutos
let lastUpdatedAt = null;

/* ── HEATMAP ENGINE v2.0 — PNG real por cancha desde GitHub ──────────────── */
let _canchaActual = null;

async function renderHeatmap(cancha) {
    const canvas = document.getElementById('heatmapOverlay');
    if (!canvas || !canvas.getContext) return;
    const dpr  = window.devicePixelRatio || 1;
    const cssW = canvas.offsetWidth  || canvas.parentElement.offsetWidth  || 500;
    const cssH = canvas.offsetHeight || canvas.parentElement.offsetHeight || 700;
    canvas.width  = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssW, cssH);
    if (!cancha || !cancha.heatmap_archivo) return;
    const url = `https://raw.githubusercontent.com/protocolfaro/faroprotocol/main/velez/heatmaps/${cancha.heatmap_archivo}`;
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
                // PNG landscape (800×520). Rotar 90° CW → portrait.
                // Recortar footer (36px abajo) y colorbar (64px derecha) del PNG.
                // Área pura del campo: x=0..736, y=0..484
                ctx.save();
                ctx.translate(cssW, 0);
                ctx.rotate(Math.PI / 2);
                ctx.drawImage(img, 0, 0, 736, 484, 0, 0, cssH, cssW);
                ctx.restore();
                resolve();
            };
        img.onerror = () => { console.error('heatmap error:', url); resolve(); };
        img.src = url;
    });
}

window.addEventListener('resize', () => {
    if (_canchaActual) renderHeatmap(_canchaActual);
});

/* ── NODOS POR CANCHA ─────────────────────────────────────────────────────── */
function nodosDesdeCancha(cancha) {
    if (cancha.zonas_estres?.nodos) return cancha.zonas_estres.nodos;
    const ndvi   = cancha.ndvi || 0.08;
    const estado = cancha.estado_detectado || 'normal';
    const s = estado === 'resiembra_activa' ? 0.90 :
              estado === 'stress_hidrico'   ? 0.70 :
              estado === 'compactacion'     ? 0.75 :
              estado === 'fungosis'         ? 0.65 :
              Math.max(0.08, Math.min(0.95, 1 - (ndvi / 0.65)));
    const v = ((cancha.id?.charCodeAt(0) || 50) % 10) / 40;
    return [
        { x: 0.25, y: 0.15, stress: Math.min(1, s * 0.75 + v)       },
        { x: 0.75, y: 0.15, stress: Math.min(1, s * 0.70 + v * 0.8) },
        { x: 0.25, y: 0.50, stress: Math.min(1, s       + v * 0.5)  },
        { x: 0.75, y: 0.50, stress: Math.min(1, s * 0.95 + v * 0.6) },
        { x: 0.25, y: 0.85, stress: Math.min(1, s * 0.80 + v * 0.7) },
        { x: 0.75, y: 0.85, stress: Math.min(1, s * 0.75 + v * 0.9) },
    ];
}

/* ── SYNC ─────────────────────────────────────────────────────────────────── */
function syncPanelData(cancha, wl, hermesMap = {}) {
    const hm           = hermesMap[cancha.id] || {};
    const hermesStatus = hm.hermes_status || null;

    // --- HEATMAP ---
    _canchaActual = cancha;
    renderHeatmap(cancha);

    const nodesEl = document.getElementById('nodesOverlay');
    nodesEl.innerHTML = '';
    const nodos = nodosDesdeCancha(cancha);
    nodos.forEach(n => {
        const dot = document.createElement('div');
        dot.className = 'node-dot';
        dot.style.left = `${n.x * 100}%`;
        dot.style.top  = `${n.y * 100}%`;
        nodesEl.appendChild(dot);
    });

    // --- ESTADO ---
    const estado    = cancha.estado_detectado || 'normal';
    const ndvi      = cancha.ndvi != null ? parseFloat(cancha.ndvi) : null;
    const isCritico = hermesStatus === 'ALERTA_ANOMALIA'
                   || estado === 'stress_hidrico'
                   || (ndvi !== null && ndvi < 0.20);
    const isAlerta  = !isCritico && (estado === 'compactacion' || estado === 'fungosis');
    const estadoColor = isCritico ? '#ff4444' : isAlerta ? '#ffaa00' : '#44aa44';
    const estadoLabel = isCritico ? 'CRÍTICO'  : isAlerta ? 'ALERTA'  : 'NORMAL';

    // --- BADGE HEATMAP ---
    const hmBadge = document.getElementById('hmStatusBadge');
    if (hmBadge) {
        hmBadge.textContent       = estadoLabel;
        hmBadge.style.background  = estadoColor;
    }

    // --- DATOS OPERATIVOS ---
    const et0  = wl.et0_mm_dia             != null ? parseFloat(wl.et0_mm_dia)              : null;
    const ds   = wl.riesgo_dollar_spot_pct != null ? parseFloat(wl.riesgo_dollar_spot_pct)  : null;
    const temp = wl.temp_superficie_lst_c  != null ? parseFloat(wl.temp_superficie_lst_c)
               : wl.temp_suelo_0cm         != null ? parseFloat(wl.temp_suelo_0cm)          : null;
    const hora = wl.hora_riego_optima || null;
    const ze   = cancha.zonas_estres;
    const zonaCritica  = ze?.zona_critica || null;
    const prescripcion = cancha.prescripcion_operativa || cancha.n_rec || null;
    const canchaName   = cancha.id === 'amalfitani' ? 'AMALFITANI'
                       : (cancha.id || '').toUpperCase().replace(/_/g, ' ');

    // --- FILAS MÉTRICAS ---
    const rows = [];

    if (et0 !== null) {
        let rVal, rCls;
        if (et0 > 4)      { rVal = `URGENTE — ${et0.toFixed(1)} mm/m²${hora ? ` · óptimo ${hora}` : ''}`; rCls = 'urgente'; }
        else if (et0 > 2) { rVal = `${et0.toFixed(1)} mm/m² · ${hora ? `óptimo ${hora}` : 'rutinario'}`; rCls = 'alerta'; }
        else              { rVal = `${et0.toFixed(1)} mm/m² · sin urgencia`; rCls = 'ok'; }
        rows.push({ label: 'RIEGO', value: rVal, cls: rCls });
    }

    if (ds !== null) {
        let hVal, hCls;
        if (ds > 60)      { hVal = `RIESGO ${ds.toFixed(0)}% — aplicar fungicida urgente`; hCls = 'urgente'; }
        else if (ds > 30) { hVal = `RIESGO ${ds.toFixed(0)}% — monitorear de cerca`;       hCls = 'alerta'; }
        else              { hVal = `${ds.toFixed(0)}% — dentro de rango normal`;           hCls = 'ok'; }
        rows.push({ label: 'HONGOS', value: hVal, cls: hCls });
    }

    {
        let cVal, cCls;
        if (estado === 'compactacion') {
            cVal = `DETECTADA${zonaCritica ? ' — ' + zonaCritica : ''} — subsolado en 48h`; cCls = 'urgente';
        } else if (zonaCritica && !/normal/i.test(zonaCritica)) {
            cVal = zonaCritica; cCls = 'alerta';
        } else {
            cVal = 'Sin anomalías detectadas'; cCls = 'ok';
        }
        rows.push({ label: 'COMPACTACIÓN', value: cVal, cls: cCls });
    }

    if (temp !== null) {
        let tVal, tCls;
        if (temp > 35)      { tVal = `${temp.toFixed(1)}°C — estrés térmico severo`; tCls = 'urgente'; }
        else if (temp > 28) { tVal = `${temp.toFixed(1)}°C — estrés leve`;           tCls = 'alerta'; }
        else                { tVal = `${temp.toFixed(1)}°C — rango normal`;          tCls = 'ok'; }
        rows.push({ label: 'TEMPERATURA', value: tVal, cls: tCls });
    }

    if (ndvi !== null) {
        rows.push({
            label: 'NDVI',
            value: `${ndvi.toFixed(3)} · ${estado.replace(/_/g, ' ')}`,
            cls: isCritico ? 'urgente' : isAlerta ? 'alerta' : 'ok'
        });
    }

    // --- ACCIONES ---
    const acciones = [];
    if (et0 !== null && et0 > 4) {
        acciones.push(`Riego profundo ${et0.toFixed(0)} mm${hora ? ` · ${hora}` : ''}`);
    } else if (et0 !== null && et0 > 2) {
        acciones.push(`Riego de mantenimiento ${et0.toFixed(1)} mm`);
    }
    if (ds !== null && ds > 30) {
        acciones.push(`Fungicida preventivo · ${ds.toFixed(0)}% riesgo Dollar Spot`);
    }
    if (estado === 'compactacion') {
        acciones.push('Aireación / subsolado en 48h');
    }
    if (isCritico && ndvi !== null && ndvi < 0.20) {
        acciones.push(`NDVI ${ndvi.toFixed(3)} crítico — reducir carga y fertilizar`);
    }
    if (prescripcion) {
        const partes = prescripcion.split('—').slice(1).join('—').trim();
        if (partes && partes.length > 5) acciones.push(partes);
    }
    if (acciones.length === 0) {
        acciones.push('Monitoreo rutinario · sin intervención requerida');
    }

    // --- RENDER CARD OPERATIVA ---
    const opCard = document.getElementById('uiOpCard');
    if (!opCard) return;

    opCard.innerHTML =
        '<div class="op-title">'
      +   '<div class="op-cancha-name">' + canchaName + '</div>'
      +   '<div class="op-estado-badge" style="background:' + estadoColor + '">' + estadoLabel + '</div>'
      + '</div>'
      + '<div class="op-rows">'
      + rows.map(function(r) {
            return '<div class="op-row ' + r.cls + '">'
                 + '<div class="op-row-label">' + r.label + '</div>'
                 + '<div class="op-row-value">' + r.value + '</div>'
                 + '</div>';
        }).join('')
      + '</div>'
      + '<div class="op-actions">'
      +   '<div class="op-actions-title">ACCIONES</div>'
      + acciones.map(function(a, i) {
            return '<div class="op-action-item">'
                 + '<span class="op-action-num">' + (i + 1) + '</span>'
                 + '<span class="op-action-text">' + a + '</span>'
                 + '</div>';
        }).join('')
      + '</div>';
}

/* ── INIT ─────────────────────────────────────────────────────────────────── */
async function masterInit(data = null) {
    try {
        if (!data) {
            const res = await fetch(ENDPOINT, { cache: 'no-cache' });
            data = await res.json();
        }
        wlGlobal       = data.weather_live || {};
        hermesMapGlobal = data.usuarios?.roger?.heatmaps || {};

        const estadio = data.sectores?.estadio
            ? [{
                ...data.sectores.estadio,
                ...(data.usuarios?.roger?.heatmaps?.amalfitani || {}),
                id: 'amalfitani',
                nombre: 'Amalfitani'
              }]
            : [];
        const vo = data.sectores?.canchero?.canchas || [];
        dataGlobal = [...estadio, ...vo];
        if (dataGlobal.length === 0) throw new Error('Sin canchas');

        const tabsEl = document.getElementById('tabsCanchas');
        tabsEl.innerHTML = '';
        dataGlobal.forEach((c, i) => {
            if (i === 1 && estadio.length > 0) {
                const sep = document.createElement('span');
                sep.className = 'tab-sep';
                tabsEl.appendChild(sep);
            }
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
            btn.textContent = c.id === 'amalfitani' ? 'AMALFITANI' : (c.id || '').toUpperCase();
            btn.onclick = () => {
                tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                syncPanelData(c, wlGlobal, hermesMapGlobal);
            };
            tabsEl.appendChild(btn);
        });

        syncPanelData(dataGlobal[0], wlGlobal, hermesMapGlobal);

    } catch (err) {
        console.error('Panel error:', err);
        const oc = document.getElementById('uiOpCard');
        if (oc) oc.innerHTML = '<div style="padding:20px;color:#d94f4f;font-size:11px">Error cargando telemetría — reintentando en 5 min</div>';
    }
}

async function pollLoop() {
    try {
        const res  = await fetch(ENDPOINT, { cache: 'no-cache' });
        const data = await res.json();
        const serverTs = data.updated_at;

        if (serverTs !== lastUpdatedAt) {
            lastUpdatedAt = serverTs;
            await masterInit(data);
            updateSyncBadge(serverTs, true);
        } else {
            updateSyncBadge(serverTs, false);
        }
    } catch (err) {
        console.error('Poll error:', err);
    }
    setTimeout(pollLoop, POLL_INTERVAL_MS);
}

function updateSyncBadge(ts, isNew) {
    const el = document.querySelector('.panel-sync');
    if (!el) return;
    const fecha = ts ? new Date(ts) : new Date();
    const hace  = Math.round((Date.now() - fecha.getTime()) / 60000);
    el.innerHTML = `
        ${fecha.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})} UTC<br>
        <span style="font-size:7px;opacity:0.7">
            ${isNew ? '🟢 ACTUALIZADO' : `hace ${hace} min`} · SAT/RADAR/CLIMA
        </span>`;
}

window.onload = pollLoop;
</script>
