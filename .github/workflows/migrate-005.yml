name: Migration 005 — climate_metrics_sectorial

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Run migration 005
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python3 - <<'EOF'
          import os, sys

          db_pass   = os.environ.get("SUPABASE_DB_PASSWORD", "")
          svc_key   = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          supa_url  = os.environ.get("SUPABASE_URL", "")

          sql = open("migrations/005_climate_metrics_sectorial.sql", encoding="utf-8").read()
          stmts = [s.strip() for s in sql.split(";")
                   if s.strip() and not s.strip().startswith("--")]

          # ── Intento 1: psycopg2 con SUPABASE_DB_PASSWORD ─────────────────────
          if db_pass:
              try:
                  import psycopg2
                  conn = psycopg2.connect(
                      host    = "db.xljxpzudgwhbzcnrvylo.supabase.co",
                      port    = 5432,
                      dbname  = "postgres",
                      user    = "postgres",
                      password= db_pass,
                      connect_timeout=10,
                  )
                  conn.autocommit = True
                  cur = conn.cursor()
                  for stmt in stmts:
                      cur.execute(stmt)
                      print(f"  OK: {stmt[:60]}...")
                  cur.close(); conn.close()
                  print("✅ Migration 005 ejecutada via psycopg2 (direct)")
                  sys.exit(0)
              except Exception as e:
                  print(f"psycopg2 failed: {e} — trying REST fallback")

          # ── Intento 2: REST API (verifica existencia de tabla solamente) ──────
          if svc_key and supa_url:
              import requests
              hdrs = {"apikey": svc_key, "Authorization": f"Bearer {svc_key}"}
              r = requests.get(f"{supa_url.rstrip('/')}/rest/v1/climate_metrics_sectorial?limit=1",
                               headers=hdrs, timeout=10)
              if r.status_code == 200:
                  print("✅ Tabla climate_metrics_sectorial ya existe (HTTP 200)")
                  sys.exit(0)
              elif r.status_code == 404 or "relation" in r.text.lower():
                  print(f"❌ Tabla no existe (HTTP {r.status_code}): {r.text[:200]}")
                  print("   → Ejecutar migrations/005_climate_metrics_sectorial.sql en Supabase SQL Editor")
                  sys.exit(1)
              else:
                  print(f"REST status {r.status_code}: {r.text[:200]}")

          print("❌ No hay credenciales disponibles para ejecutar la migración")
          sys.exit(1)
          EOF
