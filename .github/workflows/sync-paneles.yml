name: Sync paneles → faro-paneles
on:
  push:
    branches: [main]
    paths:
      - 'velez/**'
      - 'pasaporte/**'
  workflow_dispatch:
concurrency:
  group: sync-paneles
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions [Faro]"
      - name: Clone faro-paneles
        env:
          TOKEN: ${{ secrets.PANELES_DEPLOY_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/protocolfaro/faro-paneles.git" /tmp/faro-paneles
      - name: Sync velez/ y pasaporte/
        run: |
          mkdir -p /tmp/faro-paneles/velez
          cp -r velez/. /tmp/faro-paneles/velez/
          mkdir -p /tmp/faro-paneles/pasaporte
          cp -r pasaporte/. /tmp/faro-paneles/pasaporte/
          touch /tmp/faro-paneles/.nojekyll
      - name: Commit and push
        working-directory: /tmp/faro-paneles
        env:
          TOKEN: ${{ secrets.PANELES_DEPLOY_TOKEN }}
        run: |
          git add -A
          git diff --cached --quiet && echo "Sin cambios, nada que pushear." && exit 0
          git commit -m "sync: paneles desde faroprotocol [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push --force "https://x-access-token:${TOKEN}@github.com/protocolfaro/faro-paneles.git" main
