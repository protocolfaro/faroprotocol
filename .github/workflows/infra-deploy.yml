name: Infra Deploy

on:
  push:
    branches: [main]
    paths:
      - 'railway-backend/sports/clients/velez/audit.py'
      - 'railway-backend/alerts/**'
      - 'railway-backend/routes/**'
      - 'railway-backend/migrations/0*.sql'
      - 'railway-backend/static/dashboard.html'
      - '.github/workflows/infra-deploy.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_rls:
        description: 'Apply 003_multi_tenant.sql RLS (manual gate)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_migrations:
        description: 'Skip SQL migrations (health-check only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: infra-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: SQL Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule' && github.event.inputs.skip_migrations != 'true'

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install sqlalchemy psycopg2-binary -q

      - name: Apply migrations 001–002
        run: |
          python - <<'EOF'
          import os, sys
          from pathlib import Path
          from sqlalchemy import create_engine, text

          url = os.environ.get("SUPABASE_DB_URL", "")
          if not url:
              print("SUPABASE_DB_URL not set — skipping")
              sys.exit(0)
          url = url.replace("postgres://", "postgresql://", 1)
          eng = create_engine(url, connect_args={"connect_timeout": 15})
          for f in ["001_audit_log.sql", "002_intervention_log.sql"]:
              p = Path("railway-backend/migrations") / f
              if not p.exists():
                  print(f"SKIP {f}")
                  continue
              stmts = [s.strip() for s in p.read_text().split(";")
                       if s.strip() and not s.strip().startswith("--")]
              with eng.begin() as c:
                  for s in stmts:
                      try:
                          c.execute(text(s))
                      except Exception as e:
                          if "already exists" not in str(e).lower():
                              print(f"  warn: {e}")
              print(f"OK {f}")
          EOF

      - name: Apply 003_multi_tenant.sql (manual gate)
        if: github.event.inputs.run_rls == 'true'
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          from sqlalchemy import create_engine, text
          url = os.environ["SUPABASE_DB_URL"].replace("postgres://", "postgresql://", 1)
          eng = create_engine(url, connect_args={"connect_timeout": 15})
          p = Path("railway-backend/migrations/003_multi_tenant.sql")
          stmts = [s.strip() for s in p.read_text().split(";")
                   if s.strip() and not s.strip().startswith("--")]
          with eng.begin() as c:
              for s in stmts:
                  try:
                      c.execute(text(s))
                      print("OK:", s[:60])
                  except Exception as e:
                      print("warn:", e)
          EOF

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')

    env:
      RAILWAY_URL:     ${{ secrets.RAILWAY_URL }}
      SLACK_WEBHOOK:   ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Wait for Railway (push events only)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check /health
        id: health
        run: |
          CODE=$(curl -sf -o /tmp/health.json -w "%{http_code}" \
            --max-time 15 "${RAILWAY_URL}/health" 2>/dev/null || echo "000")
          echo "code=$CODE" >> $GITHUB_OUTPUT
          cat /tmp/health.json || true

      - name: Check /api/health/status
        id: infra
        run: |
          CODE=$(curl -sf -o /tmp/infra.json -w "%{http_code}" \
            --max-time 15 "${RAILWAY_URL}/api/health/status" 2>/dev/null || echo "000")
          echo "code=$CODE" >> $GITHUB_OUTPUT
          STATUS=$(python3 -c "import json,sys; d=json.load(open('/tmp/infra.json')); print(d.get('status','unknown'))" 2>/dev/null || echo "error")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Service status: $STATUS (HTTP $CODE)"
          cat /tmp/infra.json | python3 -m json.tool 2>/dev/null || cat /tmp/infra.json

      - name: Check dashboard.html
        run: |
          CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 "${RAILWAY_URL}/static/dashboard.html" 2>/dev/null || echo "000")
          echo "dashboard HTTP: $CODE"

      - name: Slack notify on success
        if: steps.infra.outputs.code == '200'
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":white_check_mark: *Faro Infra* — health OK · status=$(cat /tmp/infra.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get(\"status\",\"?\"))' 2>/dev/null)\"}" || true
          fi

      - name: Slack notify on failure
        if: steps.health.outputs.code != '200' || steps.infra.outputs.code != '200'
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":rotating_light: *Faro Infra* — health FAIL · /health=$(steps.health.outputs.code) /api/health/status=$(steps.infra.outputs.code)\"}" || true
          fi
          exit 1
