name: Emails semanales — Vélez Sarsfield

on:
  schedule:
    - cron: '0 10 * * 1'   # Lunes 10:00 UTC = 07:00 ART
  workflow_dispatch:        # Botón manual en GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── Checkout + Python ─────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── FASE A: Dependencias + Ingesta satelital ──────────────────────────
      - name: Instalar dependencias
        run: |
          pip install requests matplotlib pillow numpy scipy

      - name: Fase A — Ingesta de datos en caliente
        env:
          RAILWAY_URL:   ${{ secrets.RAILWAY_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd railway-backend
          python data_refresh.py || echo "[WARN] data_refresh falló — usando velez_data.json existente"
          cd ..

      # ── FASE B: Histórico + Regeneración de PNGs ─────────────────────────
      - name: Fase B — Registro histórico semanal
        run: |
          cd railway-backend
          python -c "
          import sys, json
          from pathlib import Path
          sys.path.insert(0, '.')
          vd = json.loads((Path('..') / 'velez' / 'velez_data.json').read_text(encoding='utf-8'))
          import historico
          p = historico.write_weekly_snapshot(vd)
          print('Historico OK:', p)
          " || echo "[WARN] historico falló"
          cd ..

      - name: Fase B — Regenerar PNGs frescos (headless)
        env:
          MPLBACKEND: Agg
        run: |
          cd railway-backend
          python render_reports.py || echo "[WARN] render_reports falló — PNGs existentes mantenidos"
          cd ..

      # ── Commit histórico y PNGs actualizados al repo ──────────────────────
      - name: Commit PNG + CSV histórico
        run: |
          git config user.name  "Faro Protocol Bot"
          git config user.email "protocolfaro@gmail.com"
          git add reportes_velez/*.png historico_velez_protocol.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(auto): reportes PNG + historico semana $(date +%Y-W%V)"

      - name: Push cambios
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/protocolfaro/faroprotocol.git
          git push origin main

      # ── FASE C: Despacho de correos ───────────────────────────────────────
      - name: Fase C — Enviar reportes semanales
        env:
          GMAIL_USER:    protocolfaro@gmail.com
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RAILWAY_URL:   ${{ secrets.RAILWAY_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python railway-backend/velez_scheduler.py

      # ── Resumen ───────────────────────────────────────────────────────────
      - name: Resumen del pipeline
        if: always()
        run: |
          echo "=== Pipeline Faro Protocol completado ==="
          ls -lh reportes_velez/*.png 2>/dev/null || echo "Sin PNGs en reportes_velez/"
          [ -f historico_velez_protocol.csv ] && \
            echo "historico: $(wc -l < historico_velez_protocol.csv) filas" || \
            echo "historico: archivo no encontrado"
