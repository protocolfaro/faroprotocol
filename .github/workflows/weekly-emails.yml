name: Pipeline diario — Vélez Sarsfield

on:
  schedule:
    - cron: '0 9 * * *'   # Todos los días 09:00 UTC = 06:00 ART
    - cron: '0 10 * * 1'  # Lunes 10:00 UTC = emails semanales
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Forzar envío de email'
        required: false
        default: 'false'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests matplotlib pillow numpy scipy pystac-client planetary-computer rasterio earthaccess

      - name: Fase A — Ingesta satelital diaria
        id: fase_a
        env:
          RAILWAY_URL:        ${{ secrets.RAILWAY_URL }}
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          NASA_EARTHDATA_USER: ${{ secrets.NASA_EARTHDATA_USER }}
          NASA_EARTHDATA_PASS: ${{ secrets.NASA_EARTHDATA_PASS }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          cd railway-backend/sports/clients/velez
          python data_refresh.py || exit 1
          cd ../../..
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}"             --max-time 10 "${RAILWAY_URL}/health" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "railway_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "railway_ok=false" >> "$GITHUB_OUTPUT"
          fi
          
          # Detectar si es lunes para emails
          DOW=$(date +%u)
          if [ "$DOW" = "1" ] || [ "${{ github.event.inputs.force_email }}" = "true" ]; then
            echo "send_email=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_email=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fase B — Regenerar PNGs
        if: steps.fase_a.outputs.railway_ok == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          cd railway-backend/sports/clients/velez
          python render_reports.py || echo "[WARN] render_reports falló"
          cd ../../..

      - name: Commit cambios diarios
        if: steps.fase_a.outputs.railway_ok == 'true'
        run: |
          git config user.name  "Faro Protocol Bot"
          git config user.email "protocolfaro@gmail.com"
          git add velez/velez_data.json velez/heatmaps/*.png historico/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(auto): datos diarios $(date +%Y-%m-%d)"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/protocolfaro/faroprotocol.git
          git push origin main || echo "[WARN] push falló"

      - name: Fase C — Emails semanales (solo lunes)
        if: steps.fase_a.outputs.send_email == 'true'
        env:
          GMAIL_USER:     protocolfaro@gmail.com
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          RAILWAY_URL:    ${{ secrets.RAILWAY_URL }}
          BREVO_API_KEY:  ${{ secrets.BREVO_API_KEY }}
        run: python railway-backend/sports/clients/velez/velez_scheduler.py

      - name: Resumen
        if: always()
        run: |
          echo "=== Pipeline Faro Protocol $(date +%Y-%m-%d) ==="
          echo "Railway: ${{ steps.fase_a.outputs.railway_ok }}"
          echo "Email:   ${{ steps.fase_a.outputs.send_email }}"
